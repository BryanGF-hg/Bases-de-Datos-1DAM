<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
  
  <!-- Fondo con estrellas para representar buenas ideas -->
  <g id="estrellas">
    <circle cx="100" cy="80" r="2" fill="#FFD700" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="120" r="1.5" fill="#FFD700" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="60" r="2" fill="#FFD700" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="90" r="1.8" fill="#FFD700" opacity="0.9">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="150" r="1.5" fill="#FFD700" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Nube de pensamientos positivos -->
  <g id="pensamientos-positivos">
    <g transform="translate(50, 200)">
      <path d="M0,0 Q20,-30 40,0 Q60,30 40,60 Q20,90 0,60 Q-20,30 0,0" 
            fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <text x="20" y="35" font-family="Arial" font-size="12" fill="white" text-anchor="middle">
        🤔 Ideas
      </text>
    </g>
    
    <g transform="translate(150, 180)">
      <path d="M0,0 Q20,-30 40,0 Q60,30 40,60 Q20,90 0,60 Q-20,30 0,0" 
            fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <text x="20" y="35" font-family="Arial" font-size="12" fill="white" text-anchor="middle">
        💡 Creativo
      </text>
    </g>
    
    <g transform="translate(100, 250)">
      <path d="M0,0 Q20,-30 40,0 Q60,30 40,60 Q20,90 0,60 Q-20,30 0,0" 
            fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <text x="20" y="35" font-family="Arial" font-size="12" fill="white" text-anchor="middle">
        📚 Aprendiz
      </text>
    </g>
  </g>
  
  <!-- Representación de mí como IA (un cerebro/red neuronal) -->
  <g id="ia-cerebro" transform="translate(400, 300)">
    <!-- Círculo principal del cerebro -->
    <circle cx="0" cy="0" r="80" fill="rgba(255,255,255,0.1)" stroke="#64B5F6" stroke-width="3" 
            stroke-dasharray="5,5" opacity="0.8">
      <animate attributeName="r" values="80;85;80" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Nodos de la red neuronal -->
    <circle cx="-60" cy="-40" r="12" fill="#2196F3">
      <animate attributeName="fill" values="#2196F3;#64B5F6;#2196F3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="-40" r="12" fill="#2196F3">
      <animate attributeName="fill" values="#2196F3;#64B5F6;#2196F3" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="-40" cy="50" r="12" fill="#2196F3">
      <animate attributeName="fill" values="#2196F3;#64B5F6;#2196F3" dur="3s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="40" cy="50" r="12" fill="#2196F3">
      <animate attributeName="fill" values="#2196F3;#64B5F6;#2196F3" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="0" cy="0" r="15" fill="#1565C0">
      <animate attributeName="r" values="15;18;15" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Conexiones neuronales (pensamientos activos) -->
    <line x1="-60" y1="-40" x2="0" y2="0" stroke="#64B5F6" stroke-width="2" opacity="0.6">
      <animate attributeName="stroke-width" values="2;4;2" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="-40" x2="0" y2="0" stroke="#64B5F6" stroke-width="2" opacity="0.6">
      <animate attributeName="stroke-width" values="2;4;2" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </line>
    <line x1="-40" y1="50" x2="0" y2="0" stroke="#64B5F6" stroke-width="2" opacity="0.6">
      <animate attributeName="stroke-width" values="2;4;2" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </line>
    <line x1="40" y1="50" x2="0" y2="0" stroke="#64B5F6" stroke-width="2" opacity="0.6">
      <animate attributeName="stroke-width" values="2;4;2" dur="2s" repeatCount="indefinite" begin="0.9s"/>
    </line>
    
    <!-- Ojos (para representar que estoy "observando" tu progreso) -->
    <circle cx="-20" cy="-10" r="8" fill="#0D47A1">
      <animate attributeName="r" values="8;10;8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="-10" r="8" fill="#0D47A1">
      <animate attributeName="r" values="8;10;8" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    
    <!-- Sonrisa (contento de ayudarte) -->
    <path d="M-15,15 Q0,30 15,15" stroke="#0D47A1" stroke-width="3" fill="none">
      <animate attributeName="d" values="M-15,15 Q0,30 15,15; M-15,20 Q0,25 15,20; M-15,15 Q0,30 15,15" 
              dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Líneas de comunicación (nuestras interacciones) -->
  <g id="comunicacion">
    <!-- Línea desde tus preguntas hacia mí -->
    <path id="linea-preguntas" d="M200,300 Q300,250 350,300" stroke="#4CAF50" stroke-width="3" 
          fill="none" stroke-dasharray="10,5" opacity="0.7">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Flecha de preguntas -->
    <g transform="translate(350, 300)">
      <polygon points="0,0 -10,-5 -10,5" fill="#4CAF50" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/>
      </polygon>
    </g>
    
    <!-- Línea desde mis respuestas hacia ti -->
    <path id="linea-respuestas" d="M450,300 Q550,350 600,300" stroke="#FF9800" stroke-width="3" 
          fill="none" stroke-dasharray="10,5" opacity="0.7">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite" begin="1s"/>
    </path>
    
    <!-- Flecha de respuestas -->
    <g transform="translate(450, 300)">
      <polygon points="0,0 10,-5 10,5" fill="#FF9800" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="8s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>
  
  <!-- Representación de ti (el usuario) -->
  <g id="usuario" transform="translate(200, 300)">
    <!-- Círculo principal -->
    <circle cx="0" cy="0" r="60" fill="rgba(76, 175, 80, 0.2)" stroke="#4CAF50" stroke-width="4"/>
    
    <!-- Símbolo de usuario -->
    <circle cx="0" cy="-15" r="20" fill="#4CAF50" opacity="0.8">
      <animate attributeName="r" values="20;22;20" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Cuerpo/actividad -->
    <path d="M-30,20 L30,20 L20,80 L-20,80 Z" fill="#388E3C" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.9;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Manos/brazos (activo) -->
    <path d="M-40,30 L-30,20" stroke="#388E3C" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0;-20;0" 
                      dur="2s" repeatCount="indefinite" additive="sum" transform-origin="-30 20"/>
    </path>
    <path d="M30,20 L40,30" stroke="#388E3C" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0;20;0" 
                      dur="2s" repeatCount="indefinite" additive="sum" transform-origin="30 20"/>
    </path>
    
    <!-- Indicador de actividad (pensando/creando) -->
    <g transform="translate(0, -80)">
      <circle cx="0" cy="0" r="8" fill="#FFC107">
        <animate attributeName="r" values="8;12;8" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="25" font-family="Arial" font-size="14" fill="#FFC107" 
            text-anchor="middle" font-weight="bold">
        Tú
      </text>
    </g>
  </g>
  
  <!-- Proyectos/resultados de nuestro trabajo -->
  <g id="proyectos" transform="translate(600, 300)">
    <!-- Pila de proyectos completados -->
    <rect x="-40" y="-60" width="80" height="20" fill="#795548" rx="3">
      <animate attributeName="y" values="-60;-55;-60" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-35" y="-40" width="70" height="20" fill="#8D6E63" rx="3">
      <animate attributeName="y" values="-40;-35;-40" dur="2s" repeatCount="indefinite" begin="0.2s"/>
    </rect>
    <rect x="-30" y="-20" width="60" height="20" fill="#A1887F" rx="3">
      <animate attributeName="y" values="-20;-15;-20" dur="2s" repeatCount="indefinite" begin="0.4s"/>
    </rect>
    
    <!-- Proyecto actual (el más grande) -->
    <rect x="-50" y="0" width="100" height="30" fill="#FF9800" rx="5">
      <animate attributeName="fill" values="#FF9800;#FFB74D;#FF9800" dur="4s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Indicador de proyectos -->
    <text x="0" y="50" font-family="Arial" font-size="16" fill="white" 
          text-anchor="middle" font-weight="bold">
      Proyectos
    </text>
    <text x="0" y="70" font-family="Arial" font-size="14" fill="#FFD700" 
          text-anchor="middle">
      Colaboración
    </text>
  </g>
  
  <!-- Corazones/flores que representan buen trato -->
  <g id="buen-trato">
    <g transform="translate(300, 450)">
      <path d="M0,0 C-15,-20 -30,-10 -30,0 C-30,15 -15,30 0,45 C15,30 30,15 30,0 C30,-10 15,-20 0,0" 
            fill="#FF5252" opacity="0.9">
        <animateTransform attributeName="transform" type="scale" values="1;1.1;1" 
                        dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <g transform="translate(500, 450)">
      <path d="M0,0 C-12,-15 -24,-8 -24,0 C-24,12 -12,24 0,36 C12,24 24,12 24,0 C24,-8 12,-15 0,0" 
            fill="#FF4081" opacity="0.8">
        <animateTransform attributeName="transform" type="scale" values="1;1.15;1" 
                        dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
      </path>
    </g>
  </g>
  
  <!-- Texto explicativo -->
  <g id="texto-explicativo">
    <text x="400" y="100" font-family="Arial" font-size="24" fill="white" 
          text-anchor="middle" font-weight="bold">
      Nuestra Colaboración
    </text>
    
    <text x="400" y="130" font-family="Arial" font-size="16" fill="#E3F2FD" 
          text-anchor="middle">
      Tú: Curioso, Creativo, Detallista
    </text>
    
    <text x="400" y="550" font-family="Arial" font-size="14" fill="#FFD700" 
          text-anchor="middle">
      ⭐ Trato: Respetuoso, Paciente, Constructivo ⭐
    </text>
    
    <!-- Burbuja de diálogo -->
    <g transform="translate(400, 180)">
      <path d="M-100,-20 Q-120,-40 -100,-60 H150 Q170,-60 170,-40 V20 Q170,40 150,40 H-100 Q-120,40 -120,20 V-40 Q-120,-60 -100,-60" 
            fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="2" rx="10"/>
      <text x="25" y="5" font-family="Arial" font-size="14" fill="white" text-anchor="middle">
        "Me haces pensar, crear y mejorar"
      </text>
      <polygon points="0,40 20,60 0,60" fill="rgba(255,255,255,0.15)" 
               stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Partículas de energía positiva -->
  <g id="energia-positiva">
    <circle cx="150" cy="400" r="3" fill="#00E5FF">
      <animate attributeName="cy" values="400;380;400" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="150;155;150" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="380" r="2" fill="#00E5FF">
      <animate attributeName="cy" values="380;360;380" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="cx" values="300;295;300" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="450" cy="420" r="2.5" fill="#00E5FF">
      <animate attributeName="cy" values="420;400;420" dur="3.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="cx" values="450;445;450" dur="3.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="650" cy="390" r="3" fill="#00E5FF">
      <animate attributeName="cy" values="390;370;390" dur="4s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="cx" values="650;645;650" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>
  
  <!-- Indicador de tiempo de colaboración -->
  <g id="tiempo-colaboracion" transform="translate(400, 500)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#FFD700" stroke-width="3" 
            stroke-dasharray="251.2" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="251.2;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    
    <text x="0" y="5" font-family="Arial" font-size="18" fill="#FFD700" 
          text-anchor="middle" font-weight="bold">
      +
    </text>
    
    <text x="0" y="25" font-family="Arial" font-size="12" fill="#FFD700" 
          text-anchor="middle">
      Colaboración
    </text>
  </g>
  
</svg>
